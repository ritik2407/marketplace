services:
  # Laravel PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketplace_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=marketplace
      - DB_USERNAME=root
      - DB_PASSWORD=password
      - CACHE_STORE=database
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - MAIL_MAILER=log
    networks:
      - marketplace_network
    depends_on:
      db:
        condition: service_healthy

  # Nginx Web Server
  webserver:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: marketplace_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www
    networks:
      - marketplace_network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: marketplace_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: marketplace
      MYSQL_ROOT_PASSWORD: password
      MYSQL_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - marketplace_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  marketplace_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
